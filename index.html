<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>かがし屋 見積メール作成ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #f4f6f9;
      color: #2c3e50;
      min-height: 100vh;
    }

    /* ── ヘッダー ── */
    header {
      background: #1a3a5c;
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    header span.badge {
      font-size: 0.7rem;
      background: #e67e22;
      color: #fff;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    /* ── メインレイアウト ── */
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      padding: 24px 32px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── パネル共通 ── */
    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    .panel-header {
      background: #2c5f8a;
      color: #fff;
      padding: 12px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .panel-body {
      padding: 20px;
    }

    /* ── ドロップゾーン ── */
    #drop-zone {
      border: 2px dashed #a0b8cf;
      border-radius: 8px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      margin-bottom: 20px;
    }
    #drop-zone:hover,
    #drop-zone.dragover {
      background: #eaf3fb;
      border-color: #2c5f8a;
    }
    #drop-zone .icon { font-size: 2rem; margin-bottom: 8px; }
    #drop-zone p { font-size: 0.82rem; color: #7f8c8d; line-height: 1.6; }
    #drop-zone strong { color: #2c5f8a; }
    #file-input { display: none; }
    #file-name {
      font-size: 0.78rem;
      color: #27ae60;
      margin-top: 6px;
      min-height: 1.2em;
      word-break: break-all;
    }

    /* ── フォーム ── */
    .form-section-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 18px 0 10px;
      border-bottom: 1px solid #ecf0f1;
      padding-bottom: 4px;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }
    .form-row label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
    }
    .form-row input,
    .form-row select,
    .form-row textarea {
      border: 1px solid #d5dde3;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      color: #2c3e50;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }
    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus {
      outline: none;
      border-color: #2c5f8a;
      box-shadow: 0 0 0 3px rgba(44,95,138,0.12);
    }
    .form-row textarea { resize: vertical; min-height: 60px; }
    .form-row .hint {
      font-size: 0.72rem;
      color: #95a5a6;
    }
    .input-prefix-wrap {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .input-prefix-wrap .prefix,
    .input-prefix-wrap .suffix {
      background: #ecf0f1;
      border: 1px solid #d5dde3;
      padding: 8px 10px;
      font-size: 0.85rem;
      color: #7f8c8d;
      white-space: nowrap;
    }
    .input-prefix-wrap .prefix { border-right: none; border-radius: 6px 0 0 6px; }
    .input-prefix-wrap .suffix { border-left: none; border-radius: 0 6px 6px 0; }
    .input-prefix-wrap input {
      border-radius: 0;
      flex: 1;
    }

    /* ── 生成ボタン ── */
    #btn-generate {
      width: 100%;
      padding: 12px;
      background: #e67e22;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.04em;
      transition: background 0.2s, transform 0.1s;
    }
    #btn-generate:hover { background: #cf6d17; }
    #btn-generate:active { transform: scale(0.98); }

    /* ── プレビューパネル ── */
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid #ecf0f1;
      gap: 10px;
      flex-wrap: wrap;
    }
    .preview-toolbar .label {
      font-size: 0.8rem;
      color: #7f8c8d;
    }
    .preview-toolbar .actions {
      display: flex;
      gap: 8px;
    }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    #btn-copy {
      background: #1a3a5c;
      color: #fff;
      border-color: #1a3a5c;
    }
    #btn-copy:hover { background: #0f2540; }
    #btn-copy.copied { background: #27ae60; border-color: #27ae60; }
    #btn-reset {
      background: #fff;
      color: #7f8c8d;
      border-color: #d5dde3;
    }
    #btn-reset:hover { background: #f8f9fa; color: #2c3e50; }

    #preview-area {
      padding: 24px 28px;
      font-size: 0.9rem;
      line-height: 2;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 420px;
      color: #2c3e50;
    }
    #preview-area.placeholder {
      color: #bdc3c7;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    /* ── フッター ── */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: #95a5a6;
    }

    /* ── レスポンシブ ── */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>かがし屋 見積メール作成ツール</h1>
  <span class="badge">BETA</span>
</header>

<main>

  <!-- ── 左：入力フォーム ── -->
  <section class="panel" aria-label="入力フォーム">
    <div class="panel-header">入力項目</div>
    <div class="panel-body">

      <!-- ドロップゾーン -->
      <div id="drop-zone" role="button" tabindex="0" aria-label="見積書ファイルをドロップ">
        <div class="icon">📄</div>
        <p><strong>見積書をここにドロップ</strong><br>または クリックしてファイルを選択<br><small>PDF / Excel / Word に対応予定</small></p>
        <div id="file-name"></div>
      </div>
      <input type="file" id="file-input" accept=".pdf,.xlsx,.xls,.docx" />

      <!-- 見積情報 -->
      <div class="form-section-title">見積情報</div>

      <div class="form-row">
        <label for="quote-number">見積番号</label>
        <input type="text" id="quote-number" placeholder="例：Q2024-001" />
      </div>

      <div class="form-row">
        <label for="quote-date">見積日付</label>
        <input type="date" id="quote-date" />
      </div>

      <div class="form-row">
        <label for="quote-amount">見積金額（税抜）</label>
        <div class="input-prefix-wrap">
          <span class="suffix">¥</span>
          <input type="text" id="quote-amount" placeholder="1,000,000" inputmode="numeric" />
          <span class="suffix">円</span>
        </div>
        <span class="hint">数字のみ入力（カンマ不要）</span>
      </div>

      <div class="form-row">
        <label for="quote-tax">消費税率</label>
        <select id="quote-tax">
          <option value="10">10%</option>
          <option value="8">8%</option>
          <option value="0">非課税</option>
        </select>
      </div>

      <div class="form-row">
        <label for="quote-validity">見積有効期限</label>
        <input type="date" id="quote-validity" />
        <span class="hint">未入力の場合は「発行日より30日」と表示</span>
      </div>

      <div class="form-row">
        <label for="quote-subject">件名（案件名）</label>
        <input type="text" id="quote-subject" placeholder="例：〇〇システム開発一式" />
      </div>

      <!-- 差出人情報 -->
      <div class="form-section-title">差出人情報</div>

      <div class="form-row">
        <label for="sender-company">会社名</label>
        <input type="text" id="sender-company" placeholder="例：株式会社〇〇" />
      </div>

      <div class="form-row">
        <label for="sender-name">担当者名</label>
        <input type="text" id="sender-name" placeholder="例：山田 太郎" />
      </div>

      <div class="form-row">
        <label for="sender-tel">電話番号</label>
        <input type="tel" id="sender-tel" placeholder="例：03-0000-0000" />
      </div>

      <div class="form-row">
        <label for="sender-email">メールアドレス</label>
        <input type="email" id="sender-email" placeholder="例：yamada@example.co.jp" />
      </div>

      <!-- 備考 -->
      <div class="form-section-title">備考・追記事項</div>
      <div class="form-row">
        <label for="extra-note">追記メッセージ（任意）</label>
        <textarea id="extra-note" placeholder="特記事項があればご記入ください"></textarea>
      </div>

      <button id="btn-generate">メール文面を生成する</button>
    </div>
  </section>

  <!-- ── 右：プレビュー ── -->
  <section class="panel" aria-label="メールプレビュー">
    <div class="panel-header">メールプレビュー</div>
    <div class="preview-toolbar">
      <span class="label">生成されたメール文面をコピーしてご使用ください</span>
      <div class="actions">
        <button class="btn-icon" id="btn-reset">リセット</button>
        <button class="btn-icon" id="btn-copy">📋 コピー</button>
      </div>
    </div>
    <div id="preview-area" class="placeholder">
      ← 左のフォームを入力して「メール文面を生成する」を押してください
    </div>
  </section>

</main>

<footer>株式会社かがし屋 見積提出メール作成ツール</footer>

<script>
  // ── ユーティリティ ──────────────────────────────
  const $ = id => document.getElementById(id);

  function formatMoney(raw) {
    const n = parseInt(raw.replace(/[^\d]/g, ''), 10);
    return isNaN(n) ? '—' : n.toLocaleString('ja-JP');
  }

  function formatDate(val) {
    if (!val) return null;
    const d = new Date(val);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  // ── ドロップゾーン ──────────────────────────────
  const dropZone = $('drop-zone');
  const fileInput = $('file-input');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

  function handleFile(file) {
    if (!file) return;
    $('file-name').textContent = `添付済み：${file.name}`;
    // TODO: ファイル内容解析・数値自動抽出
  }

  // ── 生成ロジック ────────────────────────────────
  $('btn-generate').addEventListener('click', generateEmail);

  function generateEmail() {
    const quoteNumber  = $('quote-number').value.trim();
    const quoteDateRaw = $('quote-date').value || today();
    const amountRaw    = $('quote-amount').value;
    const taxRate      = parseInt($('quote-tax').value, 10);
    const validityRaw  = $('quote-validity').value;
    const subject      = $('quote-subject').value.trim();
    const senderCo     = $('sender-company').value.trim();
    const senderName   = $('sender-name').value.trim();
    const senderTel    = $('sender-tel').value.trim();
    const senderEmail  = $('sender-email').value.trim();
    const extraNote    = $('extra-note').value.trim();

    // 金額計算
    const amountNum = parseInt(amountRaw.replace(/[^\d]/g, ''), 10);
    const amountStr = isNaN(amountNum) ? '—' : amountNum.toLocaleString('ja-JP');
    const taxStr    = taxRate === 0
      ? '（非課税）'
      : (() => {
          const tax = Math.floor(amountNum * taxRate / 100);
          const total = amountNum + tax;
          return `（消費税${taxRate}%：${tax.toLocaleString('ja-JP')}円、合計：${total.toLocaleString('ja-JP')}円）`;
        })();

    // 日付
    const quoteDate  = formatDate(quoteDateRaw);
    const validity   = validityRaw
      ? formatDate(validityRaw)
      : '発行日より30日間';

    // 件名
    const subjectLine = subject || '弊社サービス';

    // 差出人ブロック
    const senderBlock = [
      senderCo   ? senderCo   : null,
      senderName ? senderName : null,
      senderTel  ? `TEL：${senderTel}` : null,
      senderEmail? `E-mail：${senderEmail}` : null,
    ].filter(Boolean).join('\n');

    // 見積番号行
    const quoteNumLine = quoteNumber ? `見積番号：${quoteNumber}\n` : '';

    // 追記
    const noteLine = extraNote ? `\n-----------------------------------------\n${extraNote}\n-----------------------------------------\n` : '';

    const body =
`株式会社かがし屋
ご担当者様

お世話になっております。
${senderCo || '弊社'}の${senderName || '担当'}でございます。

この度は、${subjectLine}に関しまして、
下記のとおり見積書をご提出させていただきます。
何卒ご査収のほど、よろしくお願い申し上げます。

━━━━━━━━━━━━━━━━━━━━━━━
　見 積 内 容
━━━━━━━━━━━━━━━━━━━━━━━
件　　名　：${subjectLine}
${quoteNumLine}見積日付　：${quoteDate}
見積金額　：￥${amountStr}　${taxStr}
有効期限　：${validity}
━━━━━━━━━━━━━━━━━━━━━━━
${noteLine}
ご不明な点やご質問がございましたら、
お気軽にお申し付けください。
引き続き、どうぞよろしくお願いいたします。

---
${senderBlock || '（差出人情報を入力してください）'}
`;

    const preview = $('preview-area');
    preview.classList.remove('placeholder');
    preview.textContent = body;
  }

  // ── コピー ──────────────────────────────────────
  $('btn-copy').addEventListener('click', async () => {
    const text = $('preview-area').textContent;
    if (!text || $('preview-area').classList.contains('placeholder')) return;
    try {
      await navigator.clipboard.writeText(text);
      const btn = $('btn-copy');
      btn.textContent = '✅ コピーしました';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 コピー';
        btn.classList.remove('copied');
      }, 2000);
    } catch {
      alert('コピーに失敗しました。手動で選択してコピーしてください。');
    }
  });

  // ── リセット ────────────────────────────────────
  $('btn-reset').addEventListener('click', () => {
    document.querySelectorAll('input, textarea, select').forEach(el => {
      if (el.type === 'select-one') el.selectedIndex = 0;
      else el.value = '';
    });
    $('file-name').textContent = '';
    const preview = $('preview-area');
    preview.classList.add('placeholder');
    preview.textContent = '← 左のフォームを入力して「メール文面を生成する」を押してください';
  });

  // ── 初期値：今日の日付をセット ─────────────────
  $('quote-date').value = today();
</script>

</body>
</html>
