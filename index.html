<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>かがし屋 見積メール作成ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #f4f6f9;
      color: #2c3e50;
      min-height: 100vh;
    }

    /* ── ヘッダー ── */
    header {
      background: #1a3a5c;
      color: #fff;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; }
    header span.badge {
      font-size: 0.7rem;
      background: #e67e22;
      color: #fff;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    /* ── メインレイアウト ── */
    main {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px 32px;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ── パネル共通 ── */
    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    .panel-header {
      background: #2c5f8a;
      color: #fff;
      padding: 12px 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .panel-body { padding: 20px; }

    /* ── セクション見出し ── */
    .form-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: #7f8c8d;
      letter-spacing: 0.08em;
      margin: 20px 0 10px;
      border-bottom: 1px solid #ecf0f1;
      padding-bottom: 4px;
      text-transform: uppercase;
    }
    .form-section-title:first-child { margin-top: 0; }

    /* ── フォーム行 ── */
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }
    .form-row label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #444;
    }
    .form-row input,
    .form-row textarea {
      border: 1px solid #d5dde3;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      color: #2c3e50;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }
    .form-row input:focus,
    .form-row textarea:focus {
      outline: none;
      border-color: #2c5f8a;
      box-shadow: 0 0 0 3px rgba(44,95,138,0.12);
    }
    .form-row textarea { resize: vertical; min-height: 56px; }
    .form-row .hint { font-size: 0.72rem; color: #95a5a6; }

    /* 金額入力ラップ */
    .amount-wrap {
      display: flex;
      align-items: center;
    }
    .amount-wrap .unit {
      background: #ecf0f1;
      border: 1px solid #d5dde3;
      padding: 8px 10px;
      font-size: 0.82rem;
      color: #7f8c8d;
      white-space: nowrap;
      border-left: none;
      border-radius: 0 6px 6px 0;
    }
    .amount-wrap input {
      border-radius: 6px 0 0 6px;
      flex: 1;
    }

    /* ── 宛先チェックボックス ── */
    .recipient-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .recipient-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 7px 14px;
      border: 1.5px solid #d5dde3;
      border-radius: 20px;
      transition: all 0.15s;
      user-select: none;
    }
    .recipient-group label:hover { border-color: #2c5f8a; background: #eaf3fb; }
    .recipient-group input[type="checkbox"] { display: none; }
    .recipient-group input[type="checkbox"]:checked + span { color: #fff; }
    .recipient-group label:has(input:checked) {
      background: #2c5f8a;
      border-color: #2c5f8a;
      color: #fff;
    }

    /* ── 自動計算フィールド ── */
    .calc-result {
      background: #f0f7ff;
      border: 1.5px solid #b3d4ef;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #1a5c8a;
      letter-spacing: 0.02em;
      min-height: 38px;
    }
    .calc-result.negative { background: #fff0f0; border-color: #f0b3b3; color: #a94442; }

    /* ── 差出人ボックス ── */
    .sender-box {
      background: #f8f9fa;
      border: 1px solid #d5dde3;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.82rem;
      line-height: 1.9;
      color: #444;
    }
    .sender-box strong { display: block; font-size: 0.85rem; color: #1a3a5c; margin-bottom: 2px; }

    /* ── 生成ボタン ── */
    #btn-generate {
      width: 100%;
      padding: 13px;
      background: #e67e22;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 0.04em;
      transition: background 0.2s, transform 0.1s;
    }
    #btn-generate:hover { background: #cf6d17; }
    #btn-generate:active { transform: scale(0.98); }

    /* ── プレビューパネル ── */
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid #ecf0f1;
      gap: 10px;
      flex-wrap: wrap;
    }
    .preview-toolbar .label { font-size: 0.8rem; color: #7f8c8d; }
    .preview-toolbar .actions { display: flex; gap: 8px; }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    #btn-copy { background: #1a3a5c; color: #fff; border-color: #1a3a5c; }
    #btn-copy:hover { background: #0f2540; }
    #btn-copy.copied { background: #27ae60; border-color: #27ae60; }
    #btn-reset { background: #fff; color: #7f8c8d; border-color: #d5dde3; }
    #btn-reset:hover { background: #f8f9fa; color: #2c3e50; }

    #preview-area {
      padding: 28px 32px;
      font-size: 0.9rem;
      line-height: 2;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 480px;
      color: #2c3e50;
    }
    #preview-area.placeholder {
      color: #bdc3c7;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    /* ── フッター ── */
    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.75rem;
      color: #95a5a6;
    }

    /* ── レスポンシブ ── */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>かがし屋 見積メール作成ツール</h1>
  <span class="badge">株式会社アズマ</span>
</header>

<main>

  <!-- ── 左：入力フォーム ── -->
  <section class="panel" aria-label="入力フォーム">
    <div class="panel-header">入力項目</div>
    <div class="panel-body">

      <!-- 宛先 -->
      <div class="form-section-title">宛先（複数選択可）</div>
      <div class="recipient-group" id="recipient-group">
        <label>
          <input type="checkbox" value="亀澤" />
          <span>亀澤様</span>
        </label>
        <label>
          <input type="checkbox" value="樋口" />
          <span>樋口様</span>
        </label>
        <label>
          <input type="checkbox" value="庄司" />
          <span>庄司様</span>
        </label>
      </div>

      <!-- 案件情報 -->
      <div class="form-section-title">案件情報</div>

      <div class="form-row">
        <label for="customer-name">顧客名</label>
        <input type="text" id="customer-name" placeholder="例：江藤正彦様邸" />
      </div>

      <div class="form-row">
        <label for="work-content">工事内容</label>
        <input type="text" id="work-content" placeholder="例：エアコン2台" />
      </div>

      <div class="form-row">
        <label for="address">設置先住所</label>
        <textarea id="address" placeholder="例：福岡県うきは市浮羽町小塩4624"></textarea>
      </div>

      <!-- 金額 -->
      <div class="form-section-title">金額</div>

      <div class="form-row">
        <label for="net-price">アズマ → かがし屋様 NET（税抜）</label>
        <div class="amount-wrap">
          <input type="text" id="net-price" placeholder="0" inputmode="numeric" />
          <span class="unit">円（税抜）</span>
        </div>
      </div>

      <div class="form-row">
        <label for="customer-price">かがし屋様 → お客様見積（税込）</label>
        <div class="amount-wrap">
          <input type="text" id="customer-price" placeholder="0" inputmode="numeric" />
          <span class="unit">円（税込）</span>
        </div>
      </div>

      <div class="form-row">
        <label>かがし屋 金銭的メリット（自動計算）</label>
        <div class="calc-result" id="merit-display">—</div>
        <span class="hint">お客様税込 − NET税抜 × 1.1</span>
      </div>

      <!-- 差出人 -->
      <div class="form-section-title">差出人（固定）</div>
      <div class="sender-box">
        <strong>株式会社アズマ　再エネ推進グループ</strong>
        三宅 晃綺（みやけ こうき）<br>
        TEL: <input type="text" id="sender-tel" placeholder="000-0000-0000"
          style="border:none;border-bottom:1px dashed #aaa;outline:none;width:130px;font-size:0.82rem;padding:1px 4px;background:transparent;" /><br>
        E-mail: <input type="email" id="sender-email" placeholder="miyake@azuma.co.jp"
          style="border:none;border-bottom:1px dashed #aaa;outline:none;width:180px;font-size:0.82rem;padding:1px 4px;background:transparent;" />
      </div>

      <button id="btn-generate">メール文面を生成する</button>
    </div>
  </section>

  <!-- ── 右：プレビュー ── -->
  <section class="panel" aria-label="メールプレビュー">
    <div class="panel-header">メールプレビュー</div>
    <div class="preview-toolbar">
      <span class="label">生成されたメール文面をコピーしてご使用ください</span>
      <div class="actions">
        <button class="btn-icon" id="btn-reset">リセット</button>
        <button class="btn-icon" id="btn-copy">📋 コピー</button>
      </div>
    </div>
    <div id="preview-area" class="placeholder">
      ← 左のフォームを入力して「メール文面を生成する」を押してください
    </div>
  </section>

</main>

<footer>株式会社アズマ 再エネ推進グループ ／ かがし屋 見積提出メール作成ツール</footer>

<script>
  const $ = id => document.getElementById(id);

  // ── 数値パース・フォーマット ──────────────────────
  function parseNum(id) {
    return parseInt($( id).value.replace(/[^\d]/g, ''), 10) || 0;
  }
  function fmt(n) {
    return n.toLocaleString('ja-JP');
  }

  // ── メリット自動計算 ────────────────────────────
  function updateMerit() {
    const net      = parseNum('net-price');
    const customer = parseNum('customer-price');
    const merit    = customer - Math.round(net * 1.1);
    const el       = $('merit-display');

    if (net === 0 && customer === 0) {
      el.textContent = '—';
      el.className = 'calc-result';
      return;
    }
    el.textContent = `${fmt(merit)} 円（税込）`;
    el.className   = merit >= 0 ? 'calc-result' : 'calc-result negative';
  }

  $('net-price').addEventListener('input', updateMerit);
  $('customer-price').addEventListener('input', updateMerit);

  // ── 生成ロジック ────────────────────────────────
  $('btn-generate').addEventListener('click', generateEmail);

  function generateEmail() {
    // 宛先
    const checked = [...document.querySelectorAll('#recipient-group input:checked')]
      .map(el => el.value + '様');
    const recipient = checked.length > 0 ? checked.join('・') : '担当者様';

    // 案件
    const customerName = $('customer-name').value.trim() || '（顧客名未入力）';
    const workContent  = $('work-content').value.trim()  || '（工事内容未入力）';
    const address      = $('address').value.trim()       || '（住所未入力）';

    // 金額
    const net      = parseNum('net-price');
    const customer = parseNum('customer-price');
    const merit    = customer - Math.round(net * 1.1);
    const netStr      = fmt(net);
    const customerStr = fmt(customer);
    const meritStr    = fmt(merit);

    // 差出人
    const tel   = $('sender-tel').value.trim();
    const email = $('sender-email').value.trim();
    const telLine   = tel   ? `TEL: ${tel}`        : 'TEL: ';
    const emailLine = email ? `E-mail: ${email}`   : 'E-mail: ';

    const body =
`株式会社かがし屋
${recipient}

お世話になっております。
アズマ三宅です。

${customerName}${workContent}の御見積書になります。

金額に関しては、
【アズマ→かがし屋様へNET価格】
${netStr}円（税抜）
【かがし屋様→お客様見積金額】
${customerStr}円（税込）
【かがし屋金銭的メリット】
${meritStr}円（税込）

住所の記入お願い致します。

${address}

ご査収の程宜しくお願い致します。
引き続き宜しくお願い致します。

--
株式会社アズマ　再エネ推進グループ
三宅 晃綺（みやけ こうき）
${telLine}
${emailLine}`;

    const preview = $('preview-area');
    preview.classList.remove('placeholder');
    preview.textContent = body;
  }

  // ── コピー ──────────────────────────────────────
  $('btn-copy').addEventListener('click', async () => {
    const preview = $('preview-area');
    if (preview.classList.contains('placeholder')) return;
    try {
      await navigator.clipboard.writeText(preview.textContent);
      const btn = $('btn-copy');
      btn.textContent = '✅ コピーしました';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 コピー';
        btn.classList.remove('copied');
      }, 2000);
    } catch {
      alert('コピーに失敗しました。手動で選択してコピーしてください。');
    }
  });

  // ── リセット ────────────────────────────────────
  $('btn-reset').addEventListener('click', () => {
    document.querySelectorAll('#recipient-group input[type="checkbox"]')
      .forEach(el => { el.checked = false; });
    ['customer-name','work-content','address','net-price','customer-price'].forEach(id => {
      $(id).value = '';
    });
    $('merit-display').textContent = '—';
    $('merit-display').className = 'calc-result';
    const preview = $('preview-area');
    preview.classList.add('placeholder');
    preview.textContent = '← 左のフォームを入力して「メール文面を生成する」を押してください';
  });
</script>

</body>
</html>
